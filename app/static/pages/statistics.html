<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статистика - KM Jobs Analyzer</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .stats-card {
            background: var(--light-bg);
            border-radius: 12px;
            padding: 20px;
        }
        .stats-card h3 {
            margin-top: 0;
            color: var(--primary-color);
        }
        .company-item {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid var(--border-color);
        }
        .nav-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        .nav-btn {
            display: inline-block;
            padding: 12px 24px;
            background: var(--primary-color);
            color: white;
            border-radius: 8px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📈 Статистика и аналитика</h1>

        <div class="nav-links">
            <a href="/" class="nav-btn">🏠 Главная</a>
            <a href="/pages/vacancies.html" class="nav-btn">📋 Вакансии</a>
            <a href="/pages/km-analysis.html" class="nav-btn">🔬 KM-анализ</a>
            <a href="/pages/statistics.html" class="nav-btn">📈 Статистика</a>
        </div>

        <div class="stats-grid">
            <div class="stats-card">
                <h3>💰 Зарплатная статистика</h3>
                <div id="salary-stats"></div>
            </div>

            <div class="stats-card">
                <h3>🏢 Топ компаний по вакансиям</h3>
                <div id="companies-stats"></div>
            </div>

            <div class="stats-card">
                <h3>🔧 Топ навыков</h3>
                <div id="skills-stats"></div>
            </div>
        </div>

        <footer>
            <p>🎓 KM Jobs Analyzer - Анализ рынка труда</p>
        </footer>
    </div>

    <script src="/static/js/main.js"></script>
    <script>
        async function loadSalaryStats() {
            const data = await App.fetchAPI('/stats/salary');
            if (data) {
                document.getElementById('salary-stats').innerHTML = `
                    <p><strong>💰 Зарплата "от":</strong> ${data.salary_from_min?.toLocaleString() || '—'} - ${data.salary_from_max?.toLocaleString() || '—'} (ср. ${data.salary_from_avg?.toLocaleString() || '—'})</p>
                    <p><strong>💰 Зарплата "до":</strong> ${data.salary_to_min?.toLocaleString() || '—'} - ${data.salary_to_max?.toLocaleString() || '—'} (ср. ${data.salary_to_avg?.toLocaleString() || '—'})</p>
                    <p><strong>📊 Выборка по зарплатам:</strong> ${data.sample_size || 0} вакансий</p>
                `;
            }
        }

        async function loadCompaniesStats() {
            const data = await App.fetchAPI('/stats/companies');
            if (data && data.companies) {
                document.getElementById('companies-stats').innerHTML = data.companies.slice(0, 10).map(c => `
                    <div class="company-item">
                        <span>${c.name}</span>
                        <span class="function-count">${c.vacancies_count} вакансий</span>
                    </div>
                `).join('');
            }
        }

        async function loadSkillsStats() {
            const data = await App.fetchAPI('/skills/top?limit=10');
            if (data && data.top_skills) {
                document.getElementById('skills-stats').innerHTML = data.top_skills.map(s => `
                    <div class="company-item">
                        <span>${s.skill}</span>
                        <span class="function-count">${s.count} раз</span>
                    </div>
                `).join('');
            }
        }

        loadSalaryStats();
        loadCompaniesStats();
        loadSkillsStats();
    </script>
</body>
</html>
